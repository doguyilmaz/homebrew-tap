version: 1
tap: doguyilmaz/tap
packages:
  - name: tapster
    repo: doguyilmaz/tapster
    kind: bun
    description: "Sign, notarize and publish your releases from one Homebrew tap"
    binaries: [tapster]
    assets:
      darwin-amd64: "tapster_{version}_darwin_amd64.tar.gz"
      darwin-arm64: "tapster_{version}_darwin_arm64.tar.gz"
      linux-amd64: "tapster_{version}_linux_amd64.tar.gz"
      linux-arm64: "tapster_{version}_linux_arm64.tar.gz"
    scoop: false
  - name: aims
    repo: doguyilmaz/aims
    kind: go
    binaries: [aims]
    assets:
      darwin-amd64: "aims_{version}_darwin_amd64.tar.gz"
      darwin-arm64: "aims_{version}_darwin_arm64.tar.gz"
      linux-amd64: "aims_{version}_linux_amd64.tar.gz"
      linux-arm64: "aims_{version}_linux_arm64.tar.gz"
      windows-amd64: "aims_{version}_windows_amd64.zip"
    scoop: true
    homepage: "https://doguyilmaz.github.io/aims/"
    license: MIT
    completions:
      bash: completions/aims.bash
      zsh: completions/aims.zsh
      fish: completions/aims.fish
    description: "Several Claude Code and Codex accounts on one machine"
  - name: ebb
    repo: doguyilmaz/ebb
    kind: go
    binaries: [ebb]
    assets:
      darwin-universal: "ebb_{version}_darwin_universal.tar.gz"
    scoop: false
    homepage: "https://github.com/doguyilmaz/ebb"
    license: MIT
    app:
      name: "ebb.app"
      bundle_id: com.doguyilmaz.ebb
      binaries: ["Contents/MacOS/ebb"]
    cask:
      uninstall:
        launchctl: ["com.doguyilmaz.ebb"]
      zap:
        trash: ["~/.config/ebb","~/.local/state/ebb"]
    description: "See where your disk space went and win it back safely"
